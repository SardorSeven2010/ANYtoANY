name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodlarni yuklab olish
        uses: actions/checkout@v4

      - name: Java 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter o'rnatish
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Proektni yaratish va ruxsatlarni sozlash
        run: |
          flutter create --platforms=android --org com.anytoany.app anytoany
          cp -r anytoany/* .
          rm -rf anytoany
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle || true
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml

      - name: Kutubxonalarni o'rnatish
        run: flutter pub get

      - name: Release APK yig'ish
        run: flutter build apk --release

      - name: Tayyor APK faylni yuklashga chiqarish
        uses: actions/upload-artifact@v4
        with:
          name: ANYtoANY-APK
          path: build/app/outputs/flutter-apk/app-release.apk
